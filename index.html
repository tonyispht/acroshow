const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms)),pick=a=>a[Math.random()*a.length|0],now=()=>Date.now()/1000;

const ROUNDS=5,WRITE=60,CATS=["Things you'd say at a campsite at 3 AM","Worst excuses for being late","A terrible name for a boat","Secret ingredients in grandma's cooking","Things a pirate texts his mom","Rejected superhero powers","Bad advice from a gas station","Why the chicken really crossed the road","A new law that should exist","What the dog is thinking right now","Reviews of a haunted hotel","Overheard at a motorcycle rally","Worst first date idea","Slogans for a bad restaurant","Things you shouldn't yell in a library"],

function reset(full){if(full)G={pl:{},cnt:0};Object.values(G.pl).forEach(p=>p.score=0);Object.assign(G,{phase:'lobby',round:0,cat:'',letters:[],end:0,ans:{},votes:{},order:[],res:[],usedc:[]})}

Object.entries(A).forEach(([k,a])=>(dup[nm(a.t)]??=[]).push(k));const ks=Object.keys(A),first=ks.length>1?ks.reduce((a,b)=>A[a].at<=A[b].at?a:b):null,gain={},res=[];Object.keys(pl).forEach(k=>gain[k]=0);

Object.entries(V).forEach(([v,t])=>{if(top&&(cnt[t]||0)===top)gain[v]+=10});Object.entries(gain).forEach(([k,g])=>{pl[k].score+=g;pl[k].gain=g});res.sort((a,b)=>a.votes-b.votes||a.n-b.n);G.res=res;G.phase='result'}

const sfx={thud:()=>tone(140,.3,'sine',.6,0,.3),ding:()=>{tone(880,.3,'triangle');tone(1320,.4,'triangle',.12,.08)},tick:()=>tone(1400,.05,'square',.07),
sting:()=>[392,523,659,784,1046].forEach((f,i)=>tone(f,.3,'sawtooth',.09,i*.09)),drum:()=>{for(let i=0;i<26;i++)tone(110+i*4,.09,'triangle',.2,i*.08)},
clap(){if(!AC)return;const d=2.5,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,1.4)*(Math.random()<.03?1:.15);const s=AC.createBufferSource(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1500;s.buffer=b;s.connect(f);f.connect(AC.destination);s.start()},
win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.25,'square',.1,i*.11))};
function say(t,cut){$('cap').textContent='🎙 '+t;if(!window.speechSynthesis)return;if(cut)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[“”"]/g,''));u.pitch=.8;u.rate=1.05;speechSynthesis.speak(u)}
const cv=$('fx'),cx=cv.getContext('2d');let P=[];const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();onresize=rs;
function boom(x,y,n=140){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=4+Math.random()*11;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-7,r:3+Math.random()*5,c:`hsl(${Math.random()*360},100%,60%)`,l:90+Math.random()*70,o:Math.random()*6})}}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;cx.save();cx.translate(p.x,p.y);cx.rotate(p.o+=.2);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});requestAnimationFrame(loop)})();
const shake=()=>{const s=$('stage');s.classList.remove('shk');void s.offsetWidth;s.classList.add('shk')};
/* ===== host: screens ===== */
function goHost(){AC=new(window.AudioContext||window.webkitAudioContext)();$('menu').hidden=true;$('H').hidden=false;reset(true);sfx.sting();say('Ladies and gentlemen... welcome to ACRO SHOW!');
setInterval(()=>{tick();S=view('');render();for(const t in conns){const d=conns[t];if(d.readyState==='open')try{d.send(JSON.stringify(view(t)))}catch(e){}}},400)}
const hact=a=>act({a,pid:''});
function podium(){const el=$('pod'),key=S.players.map(p=>p.n+p.name).join();if(el.dataset.k!==key){el.dataset.k=key;el.innerHTML=S.players.map(p=>{shown[p.n]??=p.score;return`<div class=chip id=c${p.n} style="border-color:${p.color}">${esc(p.name)}<b id=s${p.n}>${shown[p.n]}</b></div>`}).join('')}
S.players.forEach(p=>$('c'+p.n).classList.toggle('done',!!p.done))}
function setScores(){S.players.forEach(p=>{const f=shown[p.n]??0,t=p.score;if(f===t)return;shown[p.n]=t;const el=$('s'+p.n);if(!el)return;const t0=performance.now();(function g(x){const k=Math.min(1,(x-t0)/1000);el.textContent=Math.round(f+(t-f)*k);if(k<1)requestAnimationFrame(g)})(t0);el.parentNode.classList.add('pop');setTimeout(()=>el.parentNode.classList.remove('pop'),700)})}
const tiles=()=>'<div id=tiles>'+S.letters.map((l,i)=>`<span class=t style="background:hsl(${i*67+280},90%,55%);box-shadow:0 0 30px hsl(${i*67+280},90%,55%)">${l}</span>`).join('')+'</div>';
function render(){podium();if(S.phase!=='result'||revealDone)setScores();
$('rd').textContent=S.round?`ROUND ${S.round}/${S.rounds}`:'';$('ct').textContent=['letters','write','vote'].includes(S.phase)?S.cat:'';
const left=Math.max(0,S.end-now()),tm=S.phase==='write'||S.phase==='vote';$('tb').style.width=tm?(left/dur*100)+'%':'0';$('tm').textContent=tm?Math.ceil(left)+'s':'';
if(tm&&left<=5&&Math.ceil(left)!==lastTick){lastTick=Math.ceil(left);sfx.tick();$('tb').style.background='#ff4b5c'}
if(S.phase==='lobby'){const st=$('st');if(st)st.hidden=S.players.length<2;const np=$('np');if(np)np.textContent=S.players.length?S.players.length+' contestant'+(S.players.length>1?'s':'')+' in the studio':'';
if(S.players.length>seen){const p=S.players[S.players.length-1],b=document.createElement('div');b.className='cat';b.textContent='🚪 '+p.name+' ENTERS THE STUDIO!';b.style.color=p.color;$('stage').appendChild(b);sfx.ding();say('Please welcome, '+p.name+'!',1);boom(innerWidth/2,innerHeight/2,80);setTimeout(()=>b.remove(),2500)}seen=S.players.length}
const key=S.phase+S.round;if(key===cur)return;cur=key;tok++;({lobby,letters,write,vote,result,final})[S.phase](tok)}
function lobby(){seen=S.players.length;shown={};$('stage').innerHTML='<h1 class=logo>ACRO·SHOW</h1><div class=cat style="font-size:22px">Tap ➕ ADD PLAYER. Each player opens the game, taps JOIN, scans my code, then shows me their screen.</div><div id=np class=cat></div><button id=st hidden onclick="hact(\'start\')">START THE SHOW</button>'}
async function letters(t){dur=1;$('stage').innerHTML=`<div class=cat>${esc(S.cat)}</div>`+tiles();sfx.sting();say(`Round ${S.round}! Your category is... ${S.cat}`,1);await sl(3600);
const ts=document.querySelectorAll('.t');for(let i=0;i<ts.length;i++){if(t!==tok)return;ts[i].classList.add('in');sfx.thud();shake();const r=ts[i].getBoundingClientRect();boom(r.x+40,r.y+40,25);say(S.letters[i],1);await sl(1600)}}
function write(t){dur=S.end-now();lastTick=-1;$('tb').style.background='';$('stage').innerHTML=`<div class=cat>${esc(S.cat)}</div>`+tiles()+'<div class=cat id=lk>Write your phrase on your phone!</div>';document.querySelectorAll('.t').forEach(e=>e.classList.add('in'));sfx.sting();say(S.letters.join('. ')+'. Go!',1);
const iv=setInterval(()=>{if(t!==tok)return clearInterval(iv);$('lk').textContent=`🔒 ${S.players.filter(p=>p.done).length}/${S.players.length} contestants locked in`},400)}
async function vote(t){dur=S.end-now();lastTick=-1;$('tb').style.background='';$('stage').innerHTML='<div class=cat>Vote for your favorite!</div><div id=cards></div>';say('Here are the answers!',1);await sl(1500);
for(let i=0;i<S.answers.length;i++){if(t!==tok)return;const a=S.answers[i],d=document.createElement('div');d.className='cd';d.innerHTML=`<i>#${i+1}</i>${esc(a.text)}`;$('cards').appendChild(d);sfx.ding();say(`Number ${i+1}. ${a.text}`,1);await sl(1600+a.text.length*65)}
if(t===tok)say('Cast your votes!')}
async function result(t){revealDone=false;dur=1;const R=S.res;$('stage').innerHTML='<div class=cat>The votes are in!</div><div id=rl></div>';sfx.drum();say(R.length?'The votes are in...':'Not enough answers this round!',1);await sl(2400);
for(let i=0;i<R.length;i++){if(t!==tok)return;const r=R[i];if(r.win&&(i===R.length-1||!R[i-1].win)){say('And the winner is...',1);sfx.drum();await sl(2300);if(t!==tok)return}
const d=document.createElement('div');d.className='rr'+(r.win?' win':'');d.style.borderColor=r.color;d.innerHTML=`<b style="color:${r.color}">${esc(r.name)}</b>: ${esc(r.text)} <b>— ${r.votes} vote${r.votes==1?'':'s'}</b><small>+${r.gain} pts${r.twin?' · 🧠 GREAT MINDS':''}${r.fast?' · ⚡ FASTEST FINGER':''}</small>`;$('rl').appendChild(d);
if(r.win){sfx.win();sfx.clap();shake();boom(innerWidth/2,innerHeight/2,260);boom(innerWidth*.2,innerHeight*.6);boom(innerWidth*.8,innerHeight*.6);say(`${pick(['The crowd has spoken','Take a bow'])}, ${r.name}! ${r.text}!`,1);await sl(4200)}
else{sfx.ding();say(`${r.name}: ${r.text}. ${r.votes} votes.`,1);await sl(2300+r.text.length*45)}}
if(t!==tok)return;revealDone=true;setScores();const b=document.createElement('button');b.textContent=S.round>=S.rounds?'FINAL RESULTS':'NEXT ROUND';b.onclick=()=>hact('next');$('stage').appendChild(b)}
function final(t){const Q=[...S.players].sort((a,b)=>b.score-a.score);revealDone=true;setScores();
$('stage').innerHTML='<h1 class=logo>CHAMPION!</h1>'+Q.map((p,i)=>`<div class=rr style="border-color:${p.color};font-size:${Math.max(16,34-i*4)}px">${['👑','🥈','🥉'][i]||i+1+'.'} ${esc(p.name)} — ${p.score}</div>`).join('')+'<button onclick="hact(\'again\')">PLAY AGAIN</button>';
sfx.win();sfx.clap();say(`And your champion is... ${Q[0].name}, with ${Q[0].score} points! Thanks for playing ACRO SHOW!`,1);
let n=0;const iv=setInterval(()=>{if(t!==tok||n++>14)return clearInterval(iv);boom(Math.random()*innerWidth,Math.random()*innerHeight*.6,120);sfx.ding()},600)}
/* ===== player ===== */
let ptok=localStorage.acro_tok||(localStorage.acro_tok=Math.random().toString(36).slice(2)+Date.now().toString(36)),dcP,PS,sig='';
const A=()=>$('app'),send=b=>dcP&&dcP.readyState==='open'&&dcP.send(JSON.stringify({...b,pid:ptok}));
function goJoin(){$('menu').hidden=true;A().hidden=false;A().innerHTML='<h1>ACRO·SHOW</h1><h2>Step into the studio!</h2><p style="max-width:380px">Tap below, then point your camera at the code on the host\'s screen.</p><button onclick=scanHost()>SCAN HOST\'S CODE</button>'}
async function scanHost(){if(!canScan()){A().innerHTML='<h2>The QR reader did not load. Open this page once with internet, then try again.</h2>';return}
let c;try{c=await getCam()}catch(e){A().innerHTML='<h2>Camera permission is needed to join.</h2><button onclick=scanHost()>TRY AGAIN</button>';return}
A().innerHTML='<h2>Looking for the host\'s code...</h2><video id=pv playsinline muted autoplay></video>';$('pv').srcObject=c;$('pv').play().catch(()=>{});scan($('pv'),s=>{if(s[0]!=='O')return;connect(s,c);return true})}
async function connect(s,cam){A().innerHTML='<h2>Connecting...</h2>';const pc=new RTCPeerConnection({iceServers:[]});
pc.ondatachannel=e=>{dcP=e.channel;dcP.onopen=()=>{cam.getTracks().forEach(t=>t.stop());send({a:'hi'});if(localStorage.acro_nm)send({a:'join',name:localStorage.acro_nm})};dcP.onmessage=onMsg;dcP.onclose=lost};
pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))lost()};
try{await pc.setRemoteDescription(unpack(s));await pc.setLocalDescription(await pc.createAnswer());await gather(pc)}catch(e){A().innerHTML='<h2>Bad code.</h2><button onclick=goJoin()>TRY AGAIN</button>';return}
A().innerHTML='<h2>Hold this up to the host\'s camera 📸</h2><canvas id=aq class=qc></canvas>';drawQR($('aq'),pack(pc.localDescription.sdp,'A'))}
function lost(){sig='';PS=null;A().innerHTML='<h1>Disconnected</h1><button onclick=location.reload()>REJOIN</button>'}
function onMsg(e){const m=JSON.parse(e.data);if(m.r){if(m.r.err&&$('er'))$('er').textContent=m.r.err;return}PS=m;pdraw()}
const ptiles=()=>PS.letters.map((l,i)=>`<span class="t in" style="background:hsl(${i*67+280},90%,55%)">${l}</span>`).join('');
function pdraw(){const m=PS.me;if(!m){if(sig!=='j'){sig='j';A().innerHTML=`<h1>YOU'RE CONNECTED!</h1><h2>Pick a contestant name</h2><input id=nm maxlength=12 value="${esc(localStorage.acro_nm||'')}" placeholder="Your name"><button onclick=pjoin()>I'M IN!</button>`}return}
const s=[PS.phase,PS.round,m.sub,m.voted].join();if(s===sig)return;sig=s;navigator.vibrate&&navigator.vibrate(80);const ph=PS.phase;
if(ph==='lobby')A().innerHTML=`<h1>YOU'RE IN!</h1><div class=pulse><h2>${esc(m.name)}</h2>Waiting for the host to start the show...</div>`;
else if(ph==='letters')A().innerHTML=`<h2>Round ${PS.round}</h2><h2>${esc(PS.cat)}</h2>${ptiles()}<p>Eyes on the big screen!</p>`;
else if(ph==='write')A().innerHTML=m.sub?`<h1>🔒 LOCKED IN</h1>${ptiles()}<p>Waiting for other contestants...</p>`:`<h2>${esc(PS.cat)}</h2>${ptiles()}<input id=tx maxlength=90 autocomplete=off placeholder="One word per letter"><div id=er style="color:#ff4b5c;min-height:24px"></div><button onclick=psub()>LOCK IT IN</button>`;
else if(ph==='vote')A().innerHTML=`<h2>${m.voted?'Vote locked! 🗳️':'Pick your favorite!'}</h2>`+PS.answers.map((a,i)=>`<button class=v ${m.voted||a.n===m.n?'disabled':''} onclick=pvote(${a.n})>#${i+1} ${esc(a.text)}${a.n===m.n?' (yours)':''}</button>`).join('');
else if(ph==='result')A().innerHTML=`<h2>Round ${PS.round} results</h2><div class=big>+${m.gain}</div><h2>Total: ${m.score}</h2><p>Watch the big screen for the reveal!</p>`;
else if(ph==='final'){const r=[...PS.players].sort((a,b)=>b.score-a.score).findIndex(p=>p.n===m.n)+1;A().innerHTML=`<h1>${r==1?'👑 CHAMPION!':'#'+r}</h1><h2>${m.score} points</h2>`}}
function pjoin(){const n=$('nm').value.trim();if(!n)return;localStorage.acro_nm=n;send({a:'join',name:n})}
const psub=()=>send({a:'ans',text:$('tx').value}),pvote=n=>send({a:'vote',n});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
